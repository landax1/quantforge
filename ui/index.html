<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Botiquant</title>
<link rel="stylesheet" href="/static/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>⚡</text></svg>">
<script>
  // Antes de pintar nada: si esto corriera con el resto del JS se vería un
  // fogonazo oscuro antes de cambiar a claro en cada carga.
  try {
    var t = localStorage.getItem("qf.theme");
    if (t === "light") document.documentElement.setAttribute("data-theme", "light");
  } catch (e) { /* sin localStorage se queda en oscuro, que es el default */ }
</script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <span class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4.5 13.2h6L9.5 22 19.5 10.5h-6.2L13 2Z"
          fill="currentColor"/></svg>
      </span>
      <span class="logo-text">Botiquant<em>strategy miner</em></span>
    </div>

    <div class="nav-rotulo">Trabajo</div>
    <nav id="nav">
      <button data-page="data">
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/>
          <path d="M4.5 11.5v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/></svg></span>
        <span>Datos</span>
      </button>
      <button data-page="mining">
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 20.5 12.5 11"/><path d="M9 4.5c3-1.6 6.4-1.2 8.8 1.2s2.8 5.8 1.2 8.8l-4-4"/>
          <path d="M9 4.5 15 10.5"/><path d="M19 14.5 13 8.5"/></svg></span>
        <span>Mining</span>
      </button>
      <button data-page="saved">
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3.5h12a1 1 0 0 1 1 1v15.2a.6.6 0 0 1-.93.5L12 16.4l-6.07 3.8A.6.6 0 0 1 5 19.7V4.5a1 1 0 0 1 1-1Z"/></svg></span>
        <span>Mis estrategias</span>
        <span class="nav-count" id="saved-count"></span>
      </button>
    </nav>

    <!-- lo llena app.js; vacío si este servidor no tiene login configurado -->
    <div class="acct" id="acct" hidden></div>

    <div class="sidebar-foot">
      <span class="status-dot" id="conn-dot"></span>
      <span id="conn-text">offline · local</span>
      <span id="version"></span>
      <button class="theme-btn" id="theme-btn" title="Cambiar tema" aria-label="Cambiar tema">
        <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.6 6.6 0 0 0 10.5 10.5Z"/>
        </svg>
      </button>
    </div>
  </aside>

  <main id="main"><!-- pages render here --></main>
</div>
<div id="toast-host"></div>
<script src="/static/charts.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
