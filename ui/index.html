<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <span class="logo-mark" aria-hidden="true">
        <i class="pulpo"></i>
      </span>
      <span class="logo-text">Botiquant<em data-i18n="nav.tagline"></em></span>
    </div>

    <!-- QUE ESTAS OPERANDO. Va arriba de todo y fuera del menú a propósito:
         no es una página sino el CONTEXTO de todas. Un CFD se opera por
         MetaTrader y paga spread; un perpetuo se opera en un exchange y paga
         comisión y funding. Son dos ejecuciones distintas, y mezclarlas en una
         sola lista obliga a entender esa diferencia antes de poder elegir
         nada. Lo llena app.js. -->
    <div class="mundo-sw" id="mundo-sw"></div>

    <!-- los rótulos los pone app.js: dependen del idioma elegido -->
    <div class="nav-rotulo" id="nav-rotulo"></div>
    <nav id="nav">
      <!-- Los tres pasos, numerados y en el orden en que se usan.
           Antes había siete entradas sin orden, y tres de ellas —Monte Carlo,
           Walk-forward, Portafolio— eran la MISMA pantalla con otro verbo: el
           mismo selector de estrategias repetido tres veces. No son lugares a
           los que ir: son cosas que se le hacen a una estrategia, y ahora
           viven dentro de ella. -->
      <button data-page="mining">
        <span class="nav-num" aria-hidden="true">1</span>
        <span data-i18n="nav.mining"></span>
        <span class="nav-count" id="banco-count"></span>
      </button>
      <button data-page="saved" data-vista="por_probar">
        <span class="nav-num" aria-hidden="true">2</span>
        <span data-i18n="nav.saved"></span>
        <span class="nav-count" id="saved-count"></span>
      </button>
      <button data-page="saved" data-vista="aprobadas" id="nav-aprobadas">
        <span class="nav-num" aria-hidden="true">3</span>
        <span data-i18n="nav.aprobadas"></span>
        <span class="nav-count" id="aprobadas-count"></span>
      </button>
      <!-- El ultimo paso del flujo, y se llama por el paso y no por el
           proveedor. "Exchanges" nombra lo que se configura una vez; lo que
           se hace aca seguido es encender y apagar un bot, y cargar la clave
           es la segunda vista de adentro. Un menu tiene que leerse como el
           orden en que se usan las cosas. -->
      <button data-page="operar" data-vista="bot" id="nav-operar">
        <span class="nav-num" aria-hidden="true">4</span>
        <span data-i18n="nav.operar"></span>
        <span class="nav-count" id="robots-count"></span>
      </button>
      <!-- LO QUE NO ES UN PASO DEL CAMINO va abajo, como ajuste: los mercados
           se eligen dentro de Buscar, la cuenta se conecta una vez, y
           Aprender está siempre a mano sin estar en el medio. -->
      <div class="nav-sep" data-i18n="nav.ajustes"></div>
      <button data-page="data" class="nav-ajuste">
        <span class="punto" aria-hidden="true"></span>
        <span data-i18n="nav.mercados"></span>
      </button>
      <button data-page="operar" data-vista="claves" class="nav-ajuste" id="nav-cuenta">
        <span class="punto" aria-hidden="true"></span>
        <span id="nav-cuenta-txt"></span>
      </button>
      <button data-page="operar" data-vista="piloto" class="nav-ajuste" id="nav-piloto">
        <span class="punto" aria-hidden="true"></span>
        <span data-i18n="nav.piloto_avanzado"></span>
      </button>
      <button data-page="consejos" class="nav-ajuste">
        <span class="punto" aria-hidden="true"></span>
        <span data-i18n="nav.tips"></span>
      </button>
    </nav>

    <!-- estado de la corrida; app.js lo muestra sólo mientras hay una -->
    <div class="corrida" id="corrida" hidden></div>

    <!-- lo llena app.js; vacío si este servidor no tiene login configurado -->
    <div class="acct" id="acct" hidden></div>

    <!-- Idioma: fila propia y con rótulo, no una sigla en la franja de estado.
         Estaba metido en el pie junto al estado y el tema, en dos botones de
         25x16 px que decían EN y ES: existía y no se encontraba. Alguien que
         abre la aplicación en inglés y no lee inglés tiene que poder ver desde
         donde está parado que se puede cambiar. -->
    <div class="lang-box">
      <span class="lang-rot" id="lang-rotulo"></span>
      <!-- lo llena app.js con los idiomas de i18n.js -->
      <div class="lang-sw" id="lang-sw"></div>
    </div>

    <!-- El camino para avisar que algo anda mal. Adentro de la aplicación
         sirve cuando la aplicación abre; cuando NO abre, el de la portada es
         el único que queda, y por eso están los dos. -->
    <a class="soporte-link" id="soporte-link" href="/soporte"
       target="_blank" rel="noopener noreferrer"></a>

    <div class="sidebar-foot">
