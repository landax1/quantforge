# nginx para botiquant.com
#
# Copiar a /etc/nginx/sites-available/botiquant, enlazar en sites-enabled y:
#   sudo certbot --nginx -d botiquant.com -d www.botiquant.com
#
# Certbot reescribe este archivo agregando el bloque 443 y los certificados.
# Lo de acá es lo que hay que tener ANTES de correrlo.

server {
    listen 80;
    server_name botiquant.com www.botiquant.com;

    # El ZIP son 54 MB. Servirlo desde nginx y no desde Python libera al
    # proceso de la aplicación: mientras alguien baja el archivo, Python
    # seguiría ocupado con esa conexión en vez de atendiendo logins.
    location /descargar {
        # X-Accel-Redirect: la aplicación decide si tenés cuenta y nginx manda
        # el archivo. El control queda en Python, el trabajo pesado en nginx.
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    location /interno/ {
        internal;                       # sólo alcanzable vía X-Accel-Redirect
        alias /opt/botiquant/dist/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Sin esto la aplicación cree que todo llega por http y marca la cookie
        # de sesión sin `secure`: el login queda a medias y nadie entiende por
        # qué.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El ejecutable pesa; sin esto nginx corta la subida de un CSV grande.
    client_max_body_size 64M;
}
